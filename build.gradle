plugins {
    id 'java'
    id 'com.gradleup.shadow'        version '8.3.6'
    id 'checkstyle'
    id 'pmd'
    id 'com.github.spotbugs'        version '6.1.7'
    id 'com.diffplug.spotless'      version '7.0.4'
}

group = 'gg.effront'
version = '2.5.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.googlecode.lanterna:lanterna:3.1.3'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
    implementation 'com.github.zhkl0228:impersonator-okhttp:1.11.0'
    implementation 'com.microsoft.playwright:playwright:1.49.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // Scripting (GraalJS)
    implementation 'org.graalvm.polyglot:polyglot:24.1.1'
    implementation 'org.graalvm.polyglot:js-community:24.1.1'

    // GUI (Swing + FlatLaf)
    implementation 'com.formdev:flatlaf:3.5.4'
    implementation 'com.formdev:flatlaf-intellij-themes:3.5.4'
    implementation 'com.fifesoft:rsyntaxtextarea:3.5.3'
    implementation 'com.fifesoft:autocomplete:3.3.1'
    implementation 'org.jfree:jfreechart:1.5.5'

    // Post-exploitation: DB Explorer
    implementation 'com.mysql:mysql-connector-j:9.1.0'
    implementation 'org.postgresql:postgresql:42.7.4'
    implementation 'com.microsoft.sqlserver:mssql-jdbc:12.8.1.jre11'
    implementation 'org.xerial:sqlite-jdbc:3.47.0.0'
    implementation 'com.oracle.database.jdbc:ojdbc11:23.6.0.24.10'
    implementation 'org.mongodb:mongodb-driver-sync:5.2.1'
    implementation 'redis.clients:jedis:5.2.0'

    // Post-exploitation: FTP/SFTP Explorer + SSH tunneling
    implementation 'commons-net:commons-net:3.11.1'
    implementation 'org.apache.sshd:sshd-sftp:2.14.0'

    testImplementation 'org.bouncycastle:bcpkix-jdk18on:1.80'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.13.0'
}

// ============================================================
// generateKnowledgeBase -- syncs knowledge-base/*.md -> knowledge_base.json
// MDs are the source of truth; the JSON is generated at build time.
// ============================================================
tasks.register('generateKnowledgeBase') {
    description = 'Generate knowledge_base.json from knowledge-base/*.md files'
    group = 'build'

    def kbDir = file('knowledge-base')
    def outputFile = file('src/main/resources/knowledge_base.json')

    inputs.dir(kbDir)
    outputs.file(outputFile)

    doLast {
        def parseFrontmatter = { String text ->
            if (!text.startsWith('---')) return null
            def end = text.indexOf('\n---', 3)
            if (end < 0) return null
            def fm = [:]
            text.substring(3, end).trim().eachLine { line ->
                def m = (line =~ /^(\w+):\s*"?(.*?)"?\s*$/)
                if (m.matches()) fm[m.group(1)] = m.group(2)
            }
            fm._bodyStart = end + 4
            return fm
        }

        def parseSections = { String body ->
            def sections = [:]
            def current = null
            def buf = new StringBuilder()
            body.eachLine { line ->
                if (line.startsWith('## ')) {
                    if (current != null) sections[current] = buf.toString().trim()
                    current = line.substring(3).trim()
                    buf = new StringBuilder()
                } else if (current != null) {
                    buf.append(line).append('\n')
                }
            }
            if (current != null) sections[current] = buf.toString().trim()
            return sections
        }

        def extractPayloads = { String sectionText ->
            if (!sectionText) return []
            def payloads = []
            def inCodeBlock = false
            sectionText.eachLine { line ->
                if (line.startsWith('```')) {
                    inCodeBlock = !inCodeBlock
                    return
                }
                if (inCodeBlock && line.trim()) {
                    payloads << line
                }
            }
            return payloads
        }

        def extractCrawlerHints = { String sectionText ->
            if (!sectionText) return null
            def params = []
            def paths = []
            sectionText.eachLine { line ->
                def lower = line.toLowerCase()
                if (lower.contains('**par') || lower.contains('**parameters')) {
                    (line =~ /`([^`]+)`/).each { params << it[1] }
                } else if (lower.contains('**paths') || lower.contains('**path')) {
                    (line =~ /`([^`]+)`/).each { paths << it[1] }
                }
            }
            if (params.isEmpty() && paths.isEmpty()) return null
            return [parameters: params, paths: paths]
        }

        def extractCves = { String sectionText ->
            if (!sectionText) return null
            def cves = []
            def headerFound = false
            sectionText.eachLine { line ->
                if (!line.startsWith('|')) return
                def cells = line.split('\\|').collect { it.trim() }.findAll { it }
                if (cells.size() < 5) return
                if (cells[0] ==~ /^-+$/ || cells[0] == 'CVE' || cells[0].toLowerCase() == 'cve') {
                    headerFound = true
                    return
                }
                if (!headerFound && cells[0] ==~ /^CVE-\d{4}-\d+$/) headerFound = true
                if (!headerFound) return
                def yearStr = cells[2].trim()
                def year = yearStr.isInteger() ? yearStr.toInteger() : 0
                cves << [
                    cve: cells[0],
                    product: cells[1],
                    year: year,
                    description: cells[3],
                    type: cells[4]
                ]
            }
            return cves.isEmpty() ? null : cves
        }

        def findSection = { Map sections, String... prefixes ->
            for (def prefix : prefixes) {
                def match = sections.find { k, v ->
                    k.toLowerCase().startsWith(prefix.toLowerCase())
                }
                if (match) return match.value
            }
            return null
        }

        def entries = new TreeMap<String, Object>()

        kbDir.listFiles()
            .findAll { it.isFile() && it.name.endsWith('.md') && it.name != 'INDEX.md' }
            .sort()
            .each { mdFile ->
                def content = mdFile.getText('UTF-8')
                def fm = parseFrontmatter(content)
                if (!fm || !fm.id || !fm.module) return

                def body = content.substring(fm._bodyStart as int)
                def sections = parseSections(body)

                def payloadsSection = findSection(sections, 'Payloads')
                def hintsSection = findSection(sections, 'Target Context')
                def cvesSection = findSection(sections, 'Notable CVEs')
                def recSection = findSection(sections, 'Recommendation', 'Remediation')

                def entry = [
                    title       : fm.title ?: '',
                    module      : fm.module ?: '',
                    severity    : fm.severity ?: '',
                    cweId       : fm.cwe_id ?: '',
                    cweTitle    : fm.cwe_title ?: '',
                    cvssVector  : fm.cvss_vector ?: '',
                    vrtId       : fm.vrt_id ?: '',
                    summary     : sections['Summary'] ?: '',
                    description : sections['Description'] ?: '',
                    impact      : sections['Impact'] ?: '',
                    payloads    : extractPayloads(payloadsSection),
                    crawlerHints: extractCrawlerHints(hintsSection),
                    recommendation: recSection ?: '',
                    notableCves : extractCves(cvesSection)
                ]

                entries[fm.id] = entry
            }

        def json = groovy.json.JsonOutput.toJson(entries)
        outputFile.text = groovy.json.JsonOutput.prettyPrint(json) + '\n'
        logger.lifecycle("generateKnowledgeBase: ${entries.size()} entries from knowledge-base/*.md")
    }
}

processResources {
    dependsOn generateKnowledgeBase
    filesMatching('version.properties') {
        expand(version: project.version)
    }
    inputs.property('projectVersion', project.version)
}

shadowJar {
    archiveBaseName = 'anarcry'
    archiveVersion = version
    archiveClassifier = ''
    manifest {
        attributes 'Main-Class': 'gg.effront.anarcry.Main'
    }
}

test {
    useJUnitPlatform {
        if (!project.hasProperty('includeIntegration')) {
            excludeTags 'integration'
        }
    }
    maxHeapSize = '1g'
    jvmArgs '-XX:+UseG1GC', '-XX:MaxGCPauseMillis=200'
}

// ============================================================
// Spotless — auto-formatador (Google Java Format)
// Uso: ./gradlew spotlessApply  (corrige)
//      ./gradlew spotlessCheck  (só verifica, usado no CI)
// ============================================================
spotless {
    java {
        // Eclipse JDT formatter — independente do javac, compativel com Java 27+
        // GJF e palantirJavaFormat usam com.sun.tools.javac internals removidos no Java 27
        eclipse('4.34').configFile('config/spotless/eclipse-java-format.xml')
        // removeUnusedImports() usa com.sun.tools.javac internals removidos no Java 27
        // imports sem uso sao pegos pelo Checkstyle (UnusedImports)
        trimTrailingWhitespace()
        endWithNewline()
        targetExclude('build/**', '.gradle/**')
    }
}

// ============================================================
// Checkstyle — equivalente ao RuboCop (estilo/formatacao)
// ============================================================
checkstyle {
    toolVersion = '10.21.4'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = false
    maxWarnings = 0
}

checkstyleTest {
    enabled = false
}

// ============================================================
// PMD — qualidade de código (complementa Checkstyle)
// ============================================================
pmd {
    toolVersion = '7.13.0'
    ruleSetFiles = files('config/pmd/pmd-ruleset.xml')
    consoleOutput = true
    // Reporta mas nao bloqueia — usar maxPriority para escalar gradualmente
    ignoreFailures = true
}

pmdTest {
    enabled = false
}

// ============================================================
// SpotBugs + FindSecBugs — equivalente ao Brakeman (SAST)
// ============================================================
spotbugs {
    toolVersion = '4.9.3'
    excludeFilter = file('config/spotbugs/spotbugs-exclude.xml')
    // Java 27 (bytecode v71) ainda nao suportado pelo SpotBugs 4.x; ignoreFailures
    // evita falso bloqueio no CI enquanto analisa o que conseguir
    ignoreFailures = true
    effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
}

spotbugsMain {
    reports {
        xml { required = true }
        html { required = false }
    }
}

spotbugsTest {
    enabled = false
}

// ============================================================
// Roda testes de integração (requerem rede externa) separadamente: ./gradlew integrationTest
tasks.register('integrationTest', Test) {
    useJUnitPlatform {
        includeTags 'integration'
    }
    group = 'verification'
    description = 'Testes que dependem de hosts externos (badssl.com, etc.)'
}

// ============================================================
// jpackage — distribuicao nativa (.deb, .rpm)
// Uso: ./gradlew jpackageDeb   (gera .deb em build/dist/)
//      ./gradlew jpackageRpm   (gera .rpm em build/dist/)
// Requer JDK com jpackage (Zulu 27+)
// ============================================================
tasks.register('jpackageDeb', Exec) {
    dependsOn shadowJar
    group = 'distribution'
    description = 'Build .deb installer via jpackage'
    def args = [
        'jpackage',
        '--type', 'deb',
        '--name', 'AnarCry',
        '--app-version', version.toString(),
        '--input', 'build/libs',
        '--main-jar', "anarcry-${version}.jar",
        '--main-class', 'gg.effront.anarcry.Main',
        '--dest', 'build/dist',
        '--java-options', '--enable-native-access=ALL-UNNAMED',
        '--linux-deb-maintainer', 'noreply@effront.gg',
        '--linux-app-category', 'utils',
        '--linux-shortcut',
        '--resource-dir', 'packaging/linux',
        '--description', 'AnarCry Security Scanner',
    ]
    if (file('public/logoAnarChy.png').exists()) {
        args += ['--icon', 'public/logoAnarChy.png']
    }
    commandLine args
}

