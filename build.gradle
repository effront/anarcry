plugins {
    id 'java'
    id 'com.gradleup.shadow'        version '8.3.6'
    id 'checkstyle'
    id 'pmd'
    id 'com.github.spotbugs'        version '6.1.7'
    id 'com.diffplug.spotless'      version '7.0.4'
}

group = 'gg.effront'
version = '1.5.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.googlecode.lanterna:lanterna:3.1.3'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
    implementation 'org.bouncycastle:bctls-jdk18on:1.80'
    implementation 'com.google.code.gson:gson:2.11.0'

    // GUI (Swing + FlatLaf)
    implementation 'com.formdev:flatlaf:3.5.4'
    implementation 'com.formdev:flatlaf-intellij-themes:3.5.4'
    implementation 'com.fifesoft:rsyntaxtextarea:3.5.3'
    implementation 'org.jfree:jfreechart:1.5.5'

    testImplementation 'org.bouncycastle:bcpkix-jdk18on:1.80'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.13.0'
}

processResources {
    filesMatching('version.properties') {
        expand(version: project.version)
    }
}

shadowJar {
    archiveBaseName = 'anarcry'
    archiveVersion = version
    archiveClassifier = ''
    manifest {
        attributes 'Main-Class': 'gg.effront.anarcry.Main'
    }
}

test {
    useJUnitPlatform {
        if (!project.hasProperty('includeIntegration')) {
            excludeTags 'integration'
        }
    }
    maxHeapSize = '1g'
    jvmArgs '-XX:+UseG1GC', '-XX:MaxGCPauseMillis=200'
}

// ============================================================
// Spotless — auto-formatador (Google Java Format)
// Uso: ./gradlew spotlessApply  (corrige)
//      ./gradlew spotlessCheck  (só verifica, usado no CI)
// ============================================================
spotless {
    java {
        // Eclipse JDT formatter — independente do javac, compativel com Java 27+
        // GJF e palantirJavaFormat usam com.sun.tools.javac internals removidos no Java 27
        eclipse('4.34').configFile('config/spotless/eclipse-java-format.xml')
        // removeUnusedImports() usa com.sun.tools.javac internals removidos no Java 27
        // imports sem uso sao pegos pelo Checkstyle (UnusedImports)
        trimTrailingWhitespace()
        endWithNewline()
        targetExclude('build/**', '.gradle/**')
    }
}

// ============================================================
// Checkstyle — equivalente ao RuboCop (estilo/formatacao)
// ============================================================
checkstyle {
    toolVersion = '10.21.4'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = false
    maxWarnings = 0
}

checkstyleTest {
    enabled = false
}

// ============================================================
// PMD — qualidade de código (complementa Checkstyle)
// ============================================================
pmd {
    toolVersion = '7.13.0'
    ruleSetFiles = files('config/pmd/pmd-ruleset.xml')
    consoleOutput = true
    // Reporta mas nao bloqueia — usar maxPriority para escalar gradualmente
    ignoreFailures = true
}

pmdTest {
    enabled = false
}

// ============================================================
// SpotBugs + FindSecBugs — equivalente ao Brakeman (SAST)
// ============================================================
spotbugs {
    toolVersion = '4.9.3'
    excludeFilter = file('config/spotbugs/spotbugs-exclude.xml')
    // Java 27 (bytecode v71) ainda nao suportado pelo SpotBugs 4.x; ignoreFailures
    // evita falso bloqueio no CI enquanto analisa o que conseguir
    ignoreFailures = true
    effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
}

spotbugsMain {
    reports {
        xml { required = true }
        html { required = false }
    }
}

spotbugsTest {
    enabled = false
}

// ============================================================
// Roda testes de integração (requerem rede externa) separadamente: ./gradlew integrationTest
tasks.register('integrationTest', Test) {
    useJUnitPlatform {
        includeTags 'integration'
    }
    group = 'verification'
    description = 'Testes que dependem de hosts externos (badssl.com, etc.)'
}

// ============================================================
// jpackage — distribuicao nativa (.deb, .rpm)
// Uso: ./gradlew jpackageDeb   (gera .deb em build/dist/)
//      ./gradlew jpackageRpm   (gera .rpm em build/dist/)
// Requer JDK com jpackage (Zulu 27+)
// ============================================================
tasks.register('jpackageDeb', Exec) {
    dependsOn shadowJar
    group = 'distribution'
    description = 'Build .deb installer via jpackage'
    commandLine 'jpackage',
        '--type', 'deb',
        '--name', 'AnarCry',
        '--app-version', version.toString(),
        '--input', 'build/libs',
        '--main-jar', "anarcry-${version}.jar",
        '--main-class', 'gg.effront.anarcry.Main',
        '--dest', 'build/dist',
        '--icon', 'public/logoAnarChy.png',
        '--java-options', '--enable-native-access=ALL-UNNAMED',
        '--linux-deb-maintainer', 'noreply@effront.gg',
        '--linux-app-category', 'utils',
        '--linux-shortcut',
        '--resource-dir', 'packaging/linux',
        '--description', 'AnarCry Security Scanner'
}

tasks.register('jpackageRpm', Exec) {
    dependsOn shadowJar
    group = 'distribution'
    description = 'Build .rpm installer via jpackage'
    commandLine 'jpackage',
        '--type', 'rpm',
        '--name', 'AnarCry',
        '--app-version', version.toString(),
        '--input', 'build/libs',
        '--main-jar', "anarcry-${version}.jar",
        '--main-class', 'gg.effront.anarcry.Main',
        '--dest', 'build/dist',
        '--icon', 'public/logoAnarChy.png',
        '--java-options', '--enable-native-access=ALL-UNNAMED',
        '--linux-rpm-license-type', 'Proprietary',
        '--linux-shortcut',
        '--resource-dir', 'packaging/linux',
        '--description', 'AnarCry Security Scanner'
}
