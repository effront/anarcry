name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read
  pull-requests: write

jobs:
  spotbugs:
    name: SpotBugs + FindSecBugs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '27'
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (skip tests)
        run: ./gradlew classes --no-daemon

      - name: Run SpotBugs
        run: ./gradlew spotbugsMain --no-daemon

      - name: Parse Results
        id: parse
        if: always()
        run: |
          REPORT=build/reports/spotbugs/main.xml
          if [ ! -f "$REPORT" ]; then
            echo "total=0" >> "$GITHUB_OUTPUT"
            echo "high=0"  >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TOTAL=$(python3 -c "import xml.etree.ElementTree as ET; t=ET.parse('$REPORT'); print(len(t.findall('.//BugInstance')))")
          HIGH=$(python3  -c "import xml.etree.ElementTree as ET; t=ET.parse('$REPORT'); print(len([b for b in t.findall('.//BugInstance') if b.get('priority','3') in ('1','2')]))")
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH"   >> "$GITHUB_OUTPUT"

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const total = '${{ steps.parse.outputs.total }}';
            const high  = '${{ steps.parse.outputs.high }}';
            const body = `## SpotBugs + FindSecBugs

            - Total findings: ${total}
            - High priority (P1/P2): ${high}

            ${high > 0 ? '❌ High-priority issues found — review before merging.' : '✅ No high-priority issues.'}
            `;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail on High Priority Issues
        if: steps.parse.outputs.high > 0
        run: |
          echo "::error::SpotBugs found ${{ steps.parse.outputs.high }} high-priority security issues!"
          exit 1

  semgrep:
    name: Semgrep Static Analysis
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=auto \
            --json \
            --output=semgrep-report.json \
            --exclude 'build/' \
            --exclude '.gradle/' \
            --exclude 'gradle/' \
            --exclude 'src/test/' \
            || true

      - name: Parse Results
        id: parse
        run: |
          TOTAL=$(jq '.results | length' semgrep-report.json)
          ERRORS=$(jq '.results | map(select(.extra.severity == "ERROR")) | length' semgrep-report.json)
          WARNINGS=$(jq '.results | map(select(.extra.severity == "WARNING")) | length' semgrep-report.json)
          CRITICAL=$(jq '.results | map(select(.extra.metadata.confidence == "HIGH" and (.extra.metadata.subcategory // "vuln") != "audit")) | length' semgrep-report.json)

          echo "errors=$ERRORS"     >> "$GITHUB_OUTPUT"
          echo "warnings=$WARNINGS" >> "$GITHUB_OUTPUT"
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "::notice::Total: $TOTAL — errors: $ERRORS, warnings: $WARNINGS, critical: $CRITICAL"

          if [ "$ERRORS" -gt 0 ]; then
            echo "::group::ERROR Severity Issues"
            jq -r '.results[] | select(.extra.severity == "ERROR") | "  - \(.path):\(.start.line) — \(.check_id)"' semgrep-report.json
            echo "::endgroup::"
          fi

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const errors   = '${{ steps.parse.outputs.errors }}';
            const warnings = '${{ steps.parse.outputs.warnings }}';
            const critical = '${{ steps.parse.outputs.critical }}';
            const body = `## Semgrep Static Analysis

            | Severity | Count |
            |----------|-------|
            | Errors   | ${errors} |
            | Critical (HIGH confidence) | ${critical} |
            | Warnings | ${warnings} |

            ${errors > 0 ? '❌ Security errors found! Fix before merging.'
              : critical > 0 ? '⚠️ High confidence issues found. Please review.'
              : warnings > 0 ? '⚠️ Warnings found (non-blocking).'
              : '✅ No issues found.'}
            `;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail on Critical Errors
        if: steps.parse.outputs.errors > 0
        run: |
          echo "::error::Semgrep found ${{ steps.parse.outputs.errors }} ERROR severity issues."
          exit 1

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  dependency-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # dependency-check roda em Docker com JDK proprio.
      # O runner define JAVA_HOME apontando para o host, que nao existe no container.
      # Desfazer via GITHUB_ENV antes da action para que o container use seu proprio Java.
      - name: Clear JAVA_HOME for Docker action
        run: echo "JAVA_HOME=" >> "$GITHUB_ENV"

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'AnarCry'
          path: '.'
          format: 'JSON'
          out: 'dependency-check-report'
          args: >
            --enableRetired
            --failOnCVSS 7

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report/

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [ spotbugs, semgrep, secret-scan, dependency-check ]
    if: always()
    steps:
      - name: Write Step Summary
        run: |
          status() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              *)       echo "⚠️" ;;
            esac
          }
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Security Scan Summary

          | Check | Status |
          |-------|--------|
          | SpotBugs + FindSecBugs | $(status "${{ needs.spotbugs.result }}") ${{ needs.spotbugs.result }} |
          | Semgrep | $(status "${{ needs.semgrep.result }}") ${{ needs.semgrep.result }} |
          | Secret Detection | $(status "${{ needs.secret-scan.result }}") ${{ needs.secret-scan.result }} |
          | Dependency Check | $(status "${{ needs.dependency-check.result }}") ${{ needs.dependency-check.result }} |
          EOF

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const s = (r) => ({ success: '✅', failure: '❌' }[r] ?? '⚠️');
            const spotbugs = '${{ needs.spotbugs.result }}';
            const semgrep  = '${{ needs.semgrep.result }}';
            const secrets  = '${{ needs.secret-scan.result }}';
            const deps     = '${{ needs.dependency-check.result }}';

            const allPassed = [spotbugs, semgrep, secrets, deps].every(r => r === 'success');

            const body = `## Security Scan Summary

            | Check | Status |
            |-------|--------|
            | SpotBugs + FindSecBugs | ${s(spotbugs)} ${spotbugs} |
            | Semgrep | ${s(semgrep)} ${semgrep} |
            | Secret Detection | ${s(secrets)} ${secrets} |
            | Dependency Check | ${s(deps)} ${deps} |

            ${allPassed ? '✅ All security checks passed!' : '⚠️ Some checks failed — review the details above.'}
            `;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
