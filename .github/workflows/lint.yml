name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: write

jobs:
  spotless:
    name: Spotless (Google Java Format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '27'
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Check formatting
        run: ./gradlew spotlessCheck --no-daemon

      - name: Comment PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@00f12e3e20659f42342b1c0226afda7f7c042325 # v6
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Spotless\n\nFormatacao fora do padrao Google Java Format.\nRode `./gradlew spotlessApply` localmente e commit o resultado.',
            });

  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '27'
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain --no-daemon

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checkstyle-report
          path: build/reports/checkstyle/

      - name: Annotate PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@00f12e3e20659f42342b1c0226afda7f7c042325 # v6
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Checkstyle\n\nCheckstyle encontrou violacoes de estilo. Veja o artefato `checkstyle-report` para detalhes.',
            });

  pmd:
    name: PMD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '27'
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Run PMD
        run: ./gradlew pmdMain --no-daemon

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pmd-report
          path: build/reports/pmd/

      - name: Comment PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@00f12e3e20659f42342b1c0226afda7f7c042325 # v6
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## PMD\n\nPMD encontrou violacoes de qualidade de codigo. Veja o artefato `pmd-report` para detalhes.',
            });

  lint-summary:
    name: Lint Summary
    runs-on: ubuntu-latest
    needs: [ spotless, checkstyle, pmd ]
    if: always()
    steps:
      - name: Write Step Summary
        run: |
          status() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              *)       echo "⚠️" ;;
            esac
          }
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Lint Summary

          | Check | Status |
          |-------|--------|
          | Spotless | $(status "${{ needs.spotless.result }}") ${{ needs.spotless.result }} |
          | Checkstyle | $(status "${{ needs.checkstyle.result }}") ${{ needs.checkstyle.result }} |
          | PMD | $(status "${{ needs.pmd.result }}") ${{ needs.pmd.result }} |
          EOF
