name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: anarcry-linux
          - os: windows-latest
            target: windows
            artifact: anarcry-windows
          - os: macos-latest
            target: macos
            artifact: anarcry-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '27'
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build shadow JAR
        run: ./gradlew shadowJar --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Install dpkg (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build .deb (Linux)
        if: matrix.target == 'linux'
        run: ./gradlew jpackageDeb --no-daemon

      - name: Build .msi (Windows)
        if: matrix.target == 'windows'
        run: ./gradlew jpackageMsi --no-daemon

      - name: Build .dmg (macOS)
        if: matrix.target == 'macos'
        run: ./gradlew jpackageDmg --no-daemon

      - name: Upload JAR
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: anarcry-jar
          path: build/libs/anarcry-*.jar

      - name: Upload native package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}
          path: build/dist/*

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets

      - name: Create release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2
        with:
          generate_release_notes: true
          files: |
            release-assets/anarcry-jar/*.jar
            release-assets/anarcry-linux/*
            release-assets/anarcry-windows/*
            release-assets/anarcry-macos/*
