name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (JAR + .deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '27'
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build shadow JAR
        run: ./gradlew shadowJar --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Install dpkg (deb packaging)
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build .deb via jpackage
        run: |
          mkdir -p build/dist
          ./gradlew jpackageDeb --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anarcry-jar
          path: build/libs/anarcry-*.jar

      - name: Upload .deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anarcry-deb
          path: build/dist/*.deb

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets

      - name: Create release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2
        with:
          generate_release_notes: true
          files: |
            release-assets/anarcry-jar/*.jar
            release-assets/anarcry-deb/*.deb
